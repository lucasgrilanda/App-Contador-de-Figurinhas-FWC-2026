<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--borda:#30363d;--texto:#e6edf3;--texto2:#7d8590;--verde:#3fb950;--amarelo-l:#e3b341;--azul:#388bfd;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--texto);font-family:-apple-system,'Archivo',sans-serif;padding-bottom:32px;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--borda);padding:12px 16px;position:sticky;top:0;z-index:10;}
.topbar h1{font-size:0.95rem;font-weight:900;color:var(--amarelo-l);margin-bottom:8px;}
#busca{width:100%;background:var(--bg3);border:1px solid var(--borda);border-radius:8px;color:var(--texto);font-size:0.9rem;padding:8px 12px;outline:none;}
#busca:focus{border-color:var(--amarelo-l);}
.hint{font-size:0.65rem;color:var(--texto2);margin-top:5px;}
.lista{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.card{background:var(--bg2);border:1px solid var(--borda);border-radius:10px;overflow:hidden;}
.card-header{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--borda);}
.flag{font-size:1.3rem;line-height:1;}
.pais-nome{font-weight:700;font-size:0.88rem;}
.prefixo{font-family:monospace;font-size:0.7rem;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--amarelo-l);border:1px solid var(--borda);margin-left:auto;flex-shrink:0;}
.aliases{padding:10px 14px;display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-family:monospace;font-size:0.68rem;padding:3px 8px;border-radius:4px;background:var(--bg3);border:1px solid var(--borda);color:var(--texto2);}
.tag.curto{border-color:var(--azul);color:var(--azul);}
.tag.fonético{border-color:#8957e5;color:#8957e5;}
.card.hidden{display:none;}
.separador{font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--texto2);padding:4px 0 2px;}
.nav-back{display:inline-block;margin:12px 14px 0;font-size:0.75rem;color:var(--texto2);text-decoration:none;font-family:monospace;}
.nav-back:hover{color:var(--amarelo-l);}
.legenda{margin:10px 14px 0;display:flex;gap:10px;flex-wrap:wrap;}
.leg{font-size:0.65rem;display:flex;align-items:center;gap:4px;color:var(--texto2);}
.leg .tag{font-size:0.6rem;padding:1px 5px;}
</style>

function renderizar(filtro) {
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  const q = (filtro||'').toLowerCase().trim();
  let visiveis = 0;

  PAISES.forEach(p => {
    const todosAliases = [...p.aliases, ...p.curtos, ...p.foneticos, p.codigo.toLowerCase(), p.nome.toLowerCase()];
    const bate = !q || todosAliases.some(a => a.includes(q)) || p.nome.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q);
    if (!bate) return;
    visiveis++;

    const card = document.createElement('div');
    card.className = 'card';

    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML = `<span class="flag">${p.flag}</span><span class="pais-nome">${p.nome}</span><span class="prefixo">${p.codigo}</span>`;
    card.appendChild(header);

    const aliases = document.createElement('div');
    aliases.className = 'aliases';

    // Principais
    p.aliases.forEach(a => {
      const t = document.createElement('span'); t.className = 'tag'; t.textContent = a; aliases.appendChild(t);
    });
    // Curtos (azul)
    p.curtos.forEach(a => {
      const t = document.createElement('span'); t.className = 'tag curto'; t.textContent = a; aliases.appendChild(t);
    });
    // Fonéticos (roxo)
    p.foneticos.forEach(a => {
      const t = document.createElement('span'); t.className = 'tag fonético'; t.textContent = a; aliases.appendChild(t);
    });

    card.appendChild(aliases);
    lista.appendChild(card);
  });

  if (visiveis === 0) {
    lista.innerHTML = '<div style="color:var(--texto2);font-size:0.82rem;padding:20px 14px;">Nenhum resultado para "'+q+'"</div>';
  }
}

document.getElementById('busca').addEventListener('input', e => renderizar(e.target.value));
